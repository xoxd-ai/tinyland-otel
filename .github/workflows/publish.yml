name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run without publishing"
        required: false
        type: boolean
        default: true
permissions:
  actions: read
  contents: read
  packages: read
jobs:
  package:
    uses: xoxd-ai/ci-templates/.github/workflows/js-bazel-package.yml@v2.14.1
    with:
      runner_mode: repo_owned
      runner_labels_json: ${{ vars.PRIMARY_LINUX_RUNNER_LABELS_JSON }}
      workspace_mode: isolated
      publish_mode: hosted_exception
      node_versions: '["22"]'
      publish_node_version: "22"
      pnpm_version: "10.13.1"
      typecheck_command: pnpm typecheck
      unit_test_command: pnpm test
      build_command: pnpm build
      package_check_command: pnpm check:package
      bazel_targets: "//:pkg //:test"
      package_dir: ./bazel-bin/pkg
      npm_access: public
      npm_publish_mode: disabled
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    # Validation only (RU6, RU8). npm_publish_mode is disabled and no GitHub
    # Packages name is set (GP2), so the reusable workflow skips both publish
    # jobs. No publish permissions or secrets are granted. Releases ship as a
    # signed git tag, a GitHub release and an append-only xoxd-ai/bazel-registry
    # entry (module tummycrypt_tinyland_otel); consumers use bazel_dep.
